<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Nestora</title>
  <style>
    @font-face {
      font-family: "Instrument Serif";
      src: url("fonts/InstrumentSerif-Regular.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: "Instrument Serif";
      src: url("fonts/InstrumentSerif-Italic.ttf") format("truetype");
      font-weight: 400;
      font-style: italic;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #FAF7F2;
    }
    .card {
      width: 1200px;
      height: 630px;
      position: relative;
      background: #FAF7F2;
      overflow: hidden;
    }
    svg.scene {
      position: absolute;
      inset: 0;
      width: 1200px;
      height: 630px;
    }
    .lockup {
      position: absolute;
      left: 250px;
      right: 250px;
      top: 0;
      bottom: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    h1 {
      font-family: "Instrument Serif", "Liberation Serif", serif;
      font-weight: 400;
      font-style: normal;
      font-size: 280px;
      line-height: 0.88;
      color: #1B1F23;
      letter-spacing: -0.035em;
      white-space: nowrap;
    }
    .rule {
      width: 72px;
      height: 4px;
      margin: 22px 0 20px;
      border-radius: 2px;
      background: #E36F47;
    }
    p {
      font-family: "Instrument Serif", "Liberation Serif", serif;
      font-weight: 400;
      font-style: italic;
      font-size: 34px;
      line-height: 1;
      color: #0F4C5C;
      letter-spacing: 0.005em;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="scene" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <filter id="grain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch" />
          <feColorMatrix type="saturate" values="0" />
          <feComponentTransfer>
            <feFuncA type="linear" slope="0.18" />
          </feComponentTransfer>
        </filter>
        <clipPath id="tileClip">
          <rect x="0" y="0" width="268" height="78" />
        </clipPath>
        <radialGradient id="glow" cx="50%" cy="48%" r="42%">
          <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.55" />
          <stop offset="70%" stop-color="#FAF7F2" stop-opacity="0" />
        </radialGradient>
      </defs>

      <rect width="1200" height="630" fill="#FAF7F2" />
      <rect width="1200" height="630" fill="url(#glow)" />

      <!-- left courtyard wall -->
      <rect x="0" y="0" width="248" height="630" fill="#F4EDE4" />

      <!-- terracotta barrel tiles -->
      <g clip-path="url(#tileClip)" fill="#E36F47">
        <circle cx="22" cy="28" r="26" />
        <circle cx="70" cy="28" r="26" />
        <circle cx="118" cy="28" r="26" />
        <circle cx="166" cy="28" r="26" />
        <circle cx="214" cy="28" r="26" />
        <circle cx="262" cy="28" r="26" />
      </g>
      <rect x="0" y="0" width="248" height="18" fill="#C85A36" />

      <!-- arched doorway -->
      <path d="M46 616 V292 A78 78 0 0 1 202 292 V616 Z" fill="#0F4C5C" />
      <path d="M68 616 V310 A56 56 0 0 1 180 310 V616 Z" fill="#F7F1E8" />
      <path d="M82 616 V348 A42 42 0 0 1 166 348 V616 Z" fill="#0F4C5C" />
      <rect x="94" y="392" width="28" height="78" rx="1.5" fill="#FAF7F2" opacity="0.16" />
      <rect x="128" y="392" width="26" height="78" rx="1.5" fill="#FAF7F2" opacity="0.16" />
      <circle cx="150" cy="492" r="5.5" fill="#E36F47" />
      <!-- transom -->
      <path d="M78 292 A46 46 0 0 1 170 292" fill="none" stroke="#E36F47" stroke-width="3" />
      <circle cx="124" cy="268" r="4" fill="#E36F47" />

      <!-- olive pot beside the door -->
      <path d="M188 560 h36 l-6 40 h-24 z" fill="#E36F47" />
      <path d="M206 560 C198 520 214 500 206 468" fill="none" stroke="#0F4C5C" stroke-width="3" stroke-linecap="round" />
      <ellipse cx="192" cy="512" rx="14" ry="7" transform="rotate(-40 192 512)" fill="#0F4C5C" />
      <ellipse cx="222" cy="500" rx="14" ry="7" transform="rotate(28 222 500)" fill="#0F4C5C" />
      <ellipse cx="214" cy="478" rx="12" ry="6" transform="rotate(-18 214 478)" fill="#1A6A78" />

      <!-- right seal: nest with a roof -->
      <circle cx="1096" cy="318" r="96" fill="#E36F47" />
      <circle cx="1096" cy="318" r="82" fill="none" stroke="#FAF7F2" stroke-width="2" opacity="0.85" />
      <g transform="translate(1096 326) scale(5.2) translate(-16 -16)">
        <path d="M5.2 18.2c.6 6.2 5.2 9.4 10.8 9.4s10.2-3.2 10.8-9.4h-3.4c-.5 4.1-3.4 6.2-7.4 6.2s-6.9-2.1-7.4-6.2z" fill="#FAF7F2" />
        <path d="M8.6 18.4 16 10.2l7.4 8.2z" fill="#FAF7F2" />
        <rect x="13.6" y="16.2" width="4.8" height="6.4" rx="0.5" fill="#0F4C5C" />
      </g>

      <!-- poster edges -->
      <rect x="0" y="0" width="1200" height="12" fill="#E36F47" />
      <rect x="0" y="618" width="1200" height="12" fill="#0F4C5C" />

      <rect width="1200" height="630" filter="url(#grain)" opacity="0.35" style="mix-blend-mode: multiply" />
    </svg>

    <div class="lockup">
      <h1>Nestora</h1>
      <div class="rule"></div>
      <p>Find your stay. List your space.</p>
    </div>
  </div>
</body>
</html>
